name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Default Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Download Go dependencies
        run: go mod download
      - name: Verify Go module metadata
        run: make verify
      - name: Check formatting and vet
        run: |
          make fmt-check
          make vet
      - name: Run default tests and detect skips
        run: |
          status=0
          go test -json ./... > "$RUNNER_TEMP/default-tests.json" || status=$?
          python3 - "$RUNNER_TEMP/default-tests.json" "$status" <<'PY'
          import json
          import sys

          path, test_status = sys.argv[1], int(sys.argv[2])
          skipped = []
          with open(path, encoding="utf-8") as results:
              for line in results:
                  record = json.loads(line)
                  if record.get("Test") and record.get("Action") == "skip":
                      skipped.append(f"{record.get('Package', '')}: {record['Test']}")
          if skipped:
              print("unexpected skipped tests (allowlist is empty):")
              for name in skipped:
                  print(name)
          else:
              print("skip detection: no skipped tests")
          if test_status:
              sys.exit(test_status)
          if skipped:
              sys.exit(1)
          PY
      - name: Run race tests and detect skips
        run: |
          status=0
          go test -race -json ./... > "$RUNNER_TEMP/race-tests.json" || status=$?
          python3 - "$RUNNER_TEMP/race-tests.json" "$status" <<'PY'
          import json
          import sys

          path, test_status = sys.argv[1], int(sys.argv[2])
          skipped = []
          with open(path, encoding="utf-8") as results:
              for line in results:
                  record = json.loads(line)
                  if record.get("Test") and record.get("Action") == "skip":
                      skipped.append(f"{record.get('Package', '')}: {record['Test']}")
          if skipped:
              print("unexpected skipped tests (allowlist is empty):")
              for name in skipped:
                  print(name)
          else:
              print("skip detection: no skipped tests")
          if test_status:
              sys.exit(test_status)
          if skipped:
              sys.exit(1)
          PY
      - name: Build CLI
        run: make build
      - name: Test without cgo and detect skips
        run: |
          status=0
          CGO_ENABLED=0 go test -json ./... > "$RUNNER_TEMP/no-cgo-tests.json" || status=$?
          python3 - "$RUNNER_TEMP/no-cgo-tests.json" "$status" <<'PY'
          import json
          import sys

          path, test_status = sys.argv[1], int(sys.argv[2])
          skipped = []
          with open(path, encoding="utf-8") as results:
              for line in results:
                  record = json.loads(line)
                  if record.get("Test") and record.get("Action") == "skip":
                      skipped.append(f"{record.get('Package', '')}: {record['Test']}")
          if skipped:
              print("unexpected skipped tests (allowlist is empty):")
              for name in skipped:
                  print(name)
          else:
              print("skip detection: no skipped tests")
          if test_status:
              sys.exit(test_status)
          if skipped:
              sys.exit(1)
          PY
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-build Linux amd64 and arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/dottie-linux-amd64" ./cmd/dottie
      - name: Smoke-test Linux amd64 binary
        run: |
          "$RUNNER_TEMP/dottie-linux-amd64" version
          "$RUNNER_TEMP/dottie-linux-amd64" help

  gsettings:
    name: Native GSettings checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Install GSettings test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libglib2.0-bin
      - name: Download Go dependencies
        run: go mod download
      - name: Check native test prerequisites
        run: make native-check
      - name: Vet native GSettings tests
        run: go vet -tags gsettings ./internal/source/gnome
      - name: Run native GSettings tests and detect skips
        run: |
          status=0
          go test -json -count=1 -tags gsettings ./internal/source/gnome > "$RUNNER_TEMP/gsettings-tests.json" || status=$?
          python3 - "$RUNNER_TEMP/gsettings-tests.json" "$status" <<'PY'
          import json
          import sys

          path, test_status = sys.argv[1], int(sys.argv[2])
          skipped = []
          with open(path, encoding="utf-8") as results:
              for line in results:
                  record = json.loads(line)
                  if record.get("Test") and record.get("Action") == "skip":
                      skipped.append(f"{record.get('Package', '')}: {record['Test']}")
          if skipped:
              print("unexpected skipped tests (allowlist is empty):")
              for name in skipped:
                  print(name)
          else:
              print("skip detection: no skipped tests")
          if test_status:
              sys.exit(test_status)
          if skipped:
              sys.exit(1)
          PY
      - name: Run native GSettings race tests and detect skips
        run: |
          status=0
          go test -race -json -count=1 -tags gsettings ./internal/source/gnome > "$RUNNER_TEMP/gsettings-race-tests.json" || status=$?
          python3 - "$RUNNER_TEMP/gsettings-race-tests.json" "$status" <<'PY'
          import json
          import sys

          path, test_status = sys.argv[1], int(sys.argv[2])
          skipped = []
          with open(path, encoding="utf-8") as results:
              for line in results:
                  record = json.loads(line)
                  if record.get("Test") and record.get("Action") == "skip":
                      skipped.append(f"{record.get('Package', '')}: {record['Test']}")
          if skipped:
              print("unexpected skipped tests (allowlist is empty):")
              for name in skipped:
                  print(name)
          else:
              print("skip detection: no skipped tests")
          if test_status:
              sys.exit(test_status)
          if skipped:
              sys.exit(1)
          PY

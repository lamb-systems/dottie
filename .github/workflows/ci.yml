name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Default Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Download Go dependencies
        run: go mod download
      - name: Verify Go module metadata
        run: |
          go mod verify
          go mod tidy -diff
      - name: Check formatting, vet, and tests
        run: make check
      - name: Run race tests
        run: make test-race
      - name: Build CLI
        run: make build
      - name: Test without cgo
        run: CGO_ENABLED=0 go test ./...
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...
      - name: Smoke-test CLI without cgo
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/dottie" ./cmd/dottie
          "$RUNNER_TEMP/dottie" version
          "$RUNNER_TEMP/dottie" help

  gsettings:
    name: Native GSettings checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Install GSettings test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libglib2.0-bin
      - name: Download Go dependencies
        run: go mod download
      - name: Run native GSettings tests
        run: make test-gnome
      - name: Run native GSettings race tests
        run: make test-gnome-race

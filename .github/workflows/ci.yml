name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Verify modules
        run: make verify
      - name: Format and vet
        run: |
          make fmt-check
          make vet
      - name: Test
        run: go test -v ./...
      - name: Race
        run: go test -race ./...
      - name: Build and smoke
        run: |
          make build
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          ./bin/dottie version
          ./bin/dottie help > /dev/null

  gsettings:
    name: Native GSettings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Install GSettings prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libglib2.0-bin
      - name: Native GSettings tests
        run: make test-gnome-race

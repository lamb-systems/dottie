## Golden config for golangci-lint v2.11.2
#
# This is the best config for golangci-lint based on my experience and opinion.
# It is very strict, but not extremely strict.
# Feel free to adapt it to suit your needs.
# If this config helps you, please consider keeping a link to this repo (see the next comment).

# Based on https://github.com/maratori/golangci-lint-config

version: "2"

issues:
  # Maximum count of issues with the same text.
  # Set to 0 to disable.
  # Default: 3
  max-same-issues: 0
  max-issues-per-linter: 0
  uniq-by-line: false

formatters:
  enable:
    - goimports # checks if the code and import statements are formatted according to the 'goimports' command
    - golines # checks if code is formatted, and fixes long lines

    ## you may want to enable
    #- gci # checks if code and import statements are formatted, with additional rules
    #- gofmt # checks if the code is formatted according to 'gofmt' command
    #- gofumpt # enforces a stricter format than 'gofmt', while being backwards compatible
    #- swaggo # formats swaggo comments

  # All settings can be found here https://github.com/golangci/golangci-lint/blob/HEAD/.golangci.reference.yml
  settings:
    goimports:
      # A list of prefixes, which, if set, checks import paths
      # with the given prefixes are grouped after 3rd-party packages.
      # Default: []
      local-prefixes:
        - github.com/lamb-systems/dottie

    golines:
      max-len: 120

linters:
  enable:
    - asasalint # checks for pass []any as any in variadic func(...any)
    - asciicheck # checks that your code does not contain non-ASCII identifiers
    - bidichk # checks for dangerous unicode character sequences
    - bodyclose # checks whether HTTP response body is closed successfully
    - canonicalheader # checks whether net/http.Header uses canonical header
    - copyloopvar # detects places where loop variables are copied (Go 1.22+)
    - cyclop # checks function and package cyclomatic complexity
    - depguard # checks if package imports are in a list of acceptable packages
    - dupl # tool for code clone detection
    - durationcheck # checks for two durations multiplied together
    - embeddedstructfieldcheck # checks embedded types in structs
    - errcheck # checking for unchecked errors, these unchecked errors can be critical bugs in some cases
    - errname # checks that sentinel errors are prefixed with the Err and error types are suffixed with the Error
    - errorlint # finds code that will cause problems with the error wrapping scheme introduced in Go 1.13
    - exhaustive # checks exhaustiveness of enum switch statements
    - exptostd # detects functions from golang.org/x/exp/ that can be replaced by std functions
    - fatcontext # detects nested contexts in loops
    - forbidigo # forbids identifiers
    - funcorder # checks the order of functions, methods, and constructors
    - funlen # tool for detection of long functions
    - gocheckcompilerdirectives # validates go compiler directive comments (//go:)
    - gochecknoinits # checks that no init functions are present in Go code
    - gochecksumtype # checks exhaustiveness on Go "sum types"
    - gocognit # computes and checks the cognitive complexity of functions
    - goconst # finds repeated strings that could be replaced by a constant
    - gocritic # provides diagnostics that check for bugs, performance and style issues
    - godoclint # checks Golang's documentation practice
    - godot # checks if comments end in a period
    - gomoddirectives # manages the use of 'replace', 'retract', and 'excludes' directives in go.mod
    - goprintffuncname # checks that printf-like functions are named with f at the end
    - gosec # inspects source code for security problems
    - govet # reports suspicious constructs, such as Printf calls whose arguments do not align with the format string
    - iface # checks the incorrect use of interfaces, helping developers avoid interface pollution
    - ineffassign # detects when assignments to existing variables are not used
    - intrange # finds places where for loops could make use of an integer range
    - iotamixing # checks if iotas are being used in const blocks with other non-iota declarations
    - loggercheck # checks key value pairs for common logger libraries (kitlog,klog,logr,zap)
    - makezero # finds slice declarations with non-zero initial length
    - mirror # reports wrong mirror patterns of bytes/strings usage
    - mnd # detects magic numbers
    - modernize # suggests simplifications to Go code, using modern language and library features
    - musttag # enforces field tags in (un)marshaled structs
    - nakedret # finds naked returns in functions greater than a specified function length
    - nestif # reports deeply nested if statements
    - nilerr # finds the code that returns nil even if it checks that the error is not nil
    - nilnesserr # reports that it checks for err != nil, but it returns a different nil value error (powered by nilness and nilerr)
    - nilnil # checks that there is no simultaneous return of nil error and an invalid value
    - noctx # finds sending http request without context.Context
    - nolintlint # reports ill-formed or insufficient nolint directives
    - nonamedreturns # reports all named returns
    - nosprintfhostport # checks for misuse of Sprintf to construct a host with port in a URL
    - perfsprint # checks that fmt.Sprintf can be replaced with a faster alternative
    - predeclared # finds code that shadows one of Go's predeclared identifiers
    - promlinter # checks Prometheus metrics naming via promlint
    - protogetter # reports direct reads from proto message fields when getters should be used
    - reassign # checks that package variables are not reassigned
    - recvcheck # checks for receiver type consistency
    - revive # fast, configurable, extensible, flexible, and beautiful linter for Go, drop-in replacement of golint
    - rowserrcheck # checks whether Err of rows is checked successfully
    - sloglint # ensure consistent code style when using log/slog
    - spancheck # checks for mistakes with OpenTelemetry/Census spans
    - sqlclosecheck # checks that sql.Rows and sql.Stmt are closed
    - staticcheck # is a go vet on steroids, applying a ton of static analysis checks
    - testableexamples # checks if examples are testable (have an expected output)
    - testifylint # checks usage of github.com/stretchr/testify
    #- testpackage # makes you use a separate _test package
    - tparallel # detects inappropriate usage of t.Parallel() method in your Go test codes
    - unconvert # removes unnecessary type conversions
    - unparam # reports unused function parameters
    - unqueryvet # detects SELECT * in SQL queries and SQL builders, encouraging explicit column selection
    - unused # checks for unused constants, variables, functions and types
    - usestdlibvars # detects the possibility to use variables/constants from the Go standard library
    - usetesting # reports uses of functions with replacement inside the testing package
    - wastedassign # finds wasted assignment statements
    - whitespace # detects leading and trailing whitespace

    ## you may want to enable
    #- arangolint # opinionated best practices for arangodb client
    #- decorder # checks declaration order and count of types, constants, variables and functions
    #- exhaustruct # [highly recommend to enable] checks if all structure fields are initialized
    - ginkgolinter # [if you use ginkgo/gomega] enforces standards of using ginkgo and gomega
    #- godox # detects usage of FIXME, TODO and other keywords inside comments
    #- goheader # checks is file header matches to pattern
    #- inamedparam # [great idea, but too strict, need to ignore a lot of cases by default] reports interfaces with unnamed method parameters
    #- interfacebloat # checks the number of methods inside an interface
    #- ireturn # accept interfaces, return concrete types
    #- noinlineerr # disallows inline error handling `if err := ...; err != nil {`
    #- prealloc # [premature optimization, but can be used in some cases] finds slice declarations that could potentially be preallocated
    #- tagalign # checks that struct tags are well aligned
    #- varnamelen # [great idea, but too many false positives] checks that the length of a variable's name matches its scope
    #- wrapcheck # checks that errors returned from external packages are wrapped
    #- zerologlint # detects the wrong usage of zerolog that a user forgets to dispatch zerolog.Event

    ## disabled
    #- containedctx # detects struct contained context.Context field
    #- contextcheck # [too many false positives] checks the function whether use a non-inherited context
    #- dogsled # checks assignments with too many blank identifiers (e.g. x, _, _, _, := f())
    #- dupword # [useless without config] checks for duplicate words in the source code
    #- err113 # [too strict] checks the errors handling expressions
    #- errchkjson # [don't see profit + I'm against of omitting errors like in the first example https://github.com/breml/errchkjson] checks types passed to the json encoding functions. Reports unsupported types and optionally reports occasions, where the check for the returned error can be omitted
    #- forcetypeassert # [replaced by errcheck] finds forced type assertions
    #- gomodguard # [use more powerful depguard] allow and block lists linter for direct Go module dependencies
    #- gosmopolitan # reports certain i18n/l10n anti-patterns in your Go codebase
    #- grouper # analyzes expression groups
    #- importas # enforces consistent import aliases
    #- lll # [replaced by golines] reports long lines
    #- maintidx # measures the maintainability index of each function
    #- misspell # [useless] finds commonly misspelled English words in comments
    #- nlreturn # [too strict and mostly code is not more readable] checks for a new line before return and branch statements to increase code clarity
    #- paralleltest # [too many false positives] detects missing usage of t.Parallel() method in your Go test
    #- tagliatelle # checks the struct tags
    #- thelper # detects golang test helpers without t.Helper() call and checks the consistency of test helpers
    #- wsl # [too strict and mostly code is not more readable] whitespace linter forces you to use empty lines
    #- wsl_v5 # [too strict and mostly code is not more readable] add or remove empty lines

  # All settings can be found here https://github.com/golangci/golangci-lint/blob/HEAD/.golangci.reference.yml
  settings:
    cyclop:
      # THRESHOLD, not a disable. A refusal validator adjudicates one schema or
      # protocol stage and is written as a flat sequence of guards, one per
      # rejection reason, so its cyclomatic complexity is the number of distinct
      # refusals it can produce rather than entanglement. The largest such
      # validator in the tree scores 133; the limit is set just above that.
      # Consequence, stated plainly: cyclop no longer polices function size in
      # this style and now only reports a function that outgrows every present
      # one by a wide margin.
      max-complexity: 140
      package-average: 0.0

    depguard:
      # Rules to apply.
      #
      # Variables:
      # - File Variables
      #   Use an exclamation mark `!` to negate a variable.
      #   Example: `!$test` matches any file that is not a go test file.
      #
      #   `$all` - matches all go files
      #   `$test` - matches all go test files
      #
      # - Package Variables
      #
      #   `$gostd` - matches all of go's standard library (Pulled from `GOROOT`)
      #
      # Default (applies if no custom rules are defined): Only allow $gostd in all files.
      rules:
        "deprecated":
          # List of file globs that will match this list of settings to compare against.
          # By default, if a path is relative, it is relative to the directory where the golangci-lint command is executed.
          # The placeholder '${base-path}' is substituted with a path relative to the mode defined with `run.relative-path-mode`.
          # The placeholder '${config-path}' is substituted with a path relative to the configuration file.
          # Default: $all
          files:
            - "$all"
          # List of packages that are not allowed.
          # Entries can be a variable (starting with $), a string prefix, or an exact match (if ending with $).
          # Default: []
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead, see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead, satori's package is not maintained
            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 or later, it was not a go module before v5
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead, see https://go.dev/blog/randv2
        "non-main files":
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead, see https://go.dev/blog/slog

    embeddedstructfieldcheck:
      # Checks that sync.Mutex and sync.RWMutex are not used as embedded fields.
      # Default: false
      forbid-mutex: true

    errcheck:
      # Enabled by owner decision. Type assertions are checked and their failure
      # branch is handled at the assertion site.
      check-type-assertions: true
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      # Such cases aren't reported by default.
      # Default: false

    exhaustive:
      # Program elements to check for exhaustiveness.
      # Default: [ switch ]
      check:
        - switch
        - mapliteral
      # THRESHOLD, not a disable. A switch that ends in an explicit `default`
      # states that its author considered the unlisted cases and decided they
      # share one outcome; that is the normal shape of the status, reason and
      # file-mode mappings here. A switch with no `default` can silently lose a
      # case, and those still report.
      # Default: false
      default-signifies-exhaustive: true

    exhaustruct:
      # List of regular expressions to match type names that should be excluded from processing.
      # Anonymous structs can be matched by '<anonymous>' alias.
      # Has precedence over `include`.
      # Each regular expression must match the full type name, including package path.
      # For example, to match type `net/http.Cookie` regular expression should be `.*/http\.Cookie`,
      # but not `http\.Cookie`.
      # Default: []
      exclude:
        # std libs
        - ^net/http.Client$
        - ^net/http.Cookie$
        - ^net/http.Request$
        - ^net/http.Response$
        - ^net/http.Server$
        - ^net/http.Transport$
        - ^net/url.URL$
        - ^os/exec.Cmd$
        - ^reflect.StructField$
        # public libs
        - ^github.com/Shopify/sarama.Config$
        - ^github.com/Shopify/sarama.ProducerMessage$
        - ^github.com/mitchellh/mapstructure.DecoderConfig$
        - ^github.com/prometheus/client_golang/.+Opts$
        - ^github.com/spf13/cobra.Command$
        - ^github.com/spf13/cobra.CompletionOptions$
        - ^github.com/stretchr/testify/mock.Mock$
        - ^github.com/testcontainers/testcontainers-go.+Request$
        - ^github.com/testcontainers/testcontainers-go.FromDockerfile$
        - ^golang.org/x/tools/go/analysis.Analyzer$
        - ^google.golang.org/protobuf/.+Options$
        - ^gopkg.in/yaml.v3.Node$
      # Allows empty structures in return statements.
      # Default: false
      allow-empty-returns: true

    funcorder:
      # Checks if the exported methods of a structure are placed before the non-exported ones.
      # Default: true
      struct-method: false

    funlen:
      # THRESHOLD, not a disable. A linear refusal validator spells out every
      # check, so length is a direct count of the conditions it adjudicates. The
      # largest present function is 245 lines / 183 statements; both limits are
      # set just above that and now only catch a function of unprecedented size.
      lines: 250
      statements: 190

    gochecksumtype:
      # Presence of `default` case in switch statements satisfies exhaustiveness, if all members are not listed.
      # Default: true
      default-signifies-exhaustive: false

    gocognit:
      # THRESHOLD, not a disable, and for the same reason as cyclop: the nesting
      # that scores here is the semantic hierarchy of a refusal decision tree
      # (epoch equal -> count equal -> count advanced), which cannot be
      # flattened without losing the property the function exists to state. The
      # largest present function scores 160; the limit sits just above it.
      min-complexity: 170

    nestif:
      # THRESHOLD, not a disable. Same argument as gocognit: the deepest present
      # block scores 30, so the limit sits just above the tree's current depth.
      min-complexity: 35

    goconst:
      ignore-tests: true
      min-occurrences: 10
      # EXCLUDED BY VALUE, WITH REASON. These are schema vocabulary: SQL column
      # names and JSON wire keys that repeat because the schema is written out
      # as text in queries and record maps. The literal is the schema; naming it
      # in Go would decouple the identifier from the column the reader is
      # checking and would invite a rename that silently stops matching the
      # database or the wire format. `record` is listed for the same reason even
      # though goconst points at an existing constant: the JSON key and
      # ReadStageRecord are different vocabularies that happen to share a
      # spelling, and substituting one for the other would be wrong.
      #
      # Each entry is a regular expression, not a literal: a wire key that
      # contains a metacharacter has to be escaped for the entry to match it.
      # `$type` as written never matched anything, because `$` anchors the end
      # of the text; `^\$type$` is the literal key.
      ignore-string-values:
        - "string"
        - "true"
        - "false"
        - '^\$type$'
        - "schemaVersion"
        - "outcome"
        - "table"
        - "generation"
        - "revision"
        - "vault"
        - "self"
        - "record"
        - "blocked-floor-replaced"

    gocritic:
      # EXCLUDED CHECK, WITH REASON. ifElseChain fires on if/else-if ladders
      # whose arms test different predicates (localChanged && !remoteChanged,
      # then remoteChanged && !localChanged, ...). Rewriting those as a switch
      # needs `switch {}` over boolean cases, which is less direct than the
      # ladder it replaces; the checker is aimed at ladders that branch on one
      # value, and none of the reported sites do.
      disabled-checks:
        - ifElseChain
      # Settings passed to gocritic.
      # The settings key is the name of a supported gocritic checker.
      # The list of supported checkers can be found at https://go-critic.com/overview.
      settings:
        captLocal:
          # Whether to restrict checker to params only.
          # Default: true
          paramsOnly: false
        underef:
          # Whether to skip (*x).method() calls where x is a pointer receiver.
          # Default: true
          skipRecvDeref: false

    godoclint:
      # List of rules to enable in addition to the default set.
      # Default: empty
      enable:
        # Assert no unused link in godocs.
        # https://github.com/godoc-lint/godoc-lint?tab=readme-ov-file#no-unused-link
        - no-unused-link
        # Require proper doc links to standard library declarations where applicable.
        # https://github.com/godoc-lint/godoc-lint?tab=readme-ov-file#require-stdlib-doclink
        - require-stdlib-doclink

    gosec:
      # gosec is NOT blanket-excluded. It is split by rule, because the rules it
      # runs fall into two different groups: rules that cannot be applied
      # meaningfully in this tree at all, and rules that are right in general
      # but point at a site whose property is established by a check gosec
      # cannot follow. The site-level rulings are in `issues.exclusions` below.
      excludes:
        # G104 (Errors unhandled) duplicates errcheck, which is enabled here and
        # is the tree's single authority for unchecked errors. G104 does not
        # honour the `std-error-handling` preset that errcheck runs under, so it
        # reports every deliberate `_ = rows.Close()` on a path that immediately
        # returns a more precise error. Two tools with two policies for one
        # question is worse than one.
        - G104
        # G115 (integer overflow conversion) reports every narrowing conversion.
        # In this tree those are: SQL parameter widening of counters that a
        # Limits struct has already bounded, `uint32(os.Geteuid())` and
        # `int64(stat.Dev)`/`int64(stat.Ino)` from syscall.Stat_t, and uint64
        # wire counters being written as int64 JSON numbers for a schema whose
        # own bound is far below 2^63. The rule has no notion of a preceding
        # bound check, so it fires 114 times on conversions that are correct by
        # construction. Whether each conversion is in range is a real question;
        # G115 is not answering it, and a suppression per site would hide the
        # answer as effectively as this line does. Recorded in the round report
        # as real-but-unfixed: checked narrowing helpers are the durable fix.
        - G115
        # G302 requires a file mode of 0600 or less. The reported sites are
        # directories created with 0700, which is the most restrictive mode a
        # directory can have (it needs the execute bit to be traversable) and is
        # what `secureConfigDir`, `provisionPublicationStoreDirectory` and
        # `ensurePrivateDirectory` enforce. The rule has no directory case.
        - G302
        # G202 flags string concatenation into a SQL statement. The concatenated
        # fragment is a run of `?` placeholders produced by
        # `strings.Repeat("?,", len(from))` and the values still travel as bound
        # parameters; no user data reaches the query text.
        - G202
        # G404 flags math/rand as a weak source. The only use is retry jitter in
        # `publicationRetryJitter`, which is a scheduling delay, not a secret,
        # a nonce or a key. The import was moved to math/rand/v2 in this round
        # for depguard's sake; v2 is still not a cryptographic source and does
        # not need to be here.
        - G404
        # G703/G704 are taint analyses: they follow a value from a source to
        # os.Lstat and http.NewRequest and stop where the analyzer cannot follow
        # the gate in between. The store preflight paths are
        # `filepath.Join(directory, name)` where every `name` is a literal from
        # the fixed publication-database file list and `directory` has already
        # passed `filepath.IsAbs`, `Clean` equality and an ownership/mode check;
        # the discovery fetcher passes its URL through `validateHTTPSURL`, which
        # refuses a non-https scheme, an empty host, userinfo and any query
        # before the request exists. Both gates are the whole point of those
        # functions, so the rules can only ever restate them. Auditing a future
        # path is a matter of reading the nearest gate.
        - G703
        - G704
        # G117 flags a struct field whose JSON name matches a secret pattern.
        # The reported field is the OAuth refresh token, and the marshalling is
        # the token request body sent to the provider over TLS: the secret is
        # the payload, so excluding the field would break refresh. It is never
        # logged, journaled or written to the publication store.
        - G117

    govet:
      # Enable all analyzers.
      # Default: false
      enable-all: true
      # Disable analyzers by name.
      # Run `GL_DEBUG=govet golangci-lint run --enable=govet` to see default, all available analyzers, and enabled analyzers.
      # Default: []
      disable:
        - fieldalignment
        - shadow

    inamedparam:
      # Skips check for interface methods with only a single parameter.
      # Default: false
      skip-single-param: true

    mnd:
      # Structural counts and power-of-two buffer/limit sizes are self-evident
      # in place; what mnd should catch here is an unexplained non-standard
      # literal, which is what stays enabled.
      #
      # `assign` is deliberately absent from `checks`. A literal on the right of
      # an assignment is normally a limit being *defined* - a DefaultLimits
      # field, a timeout, a buffer size - and the assignment target already
      # names it. The contexts that remain are the ones where a literal sits
      # inside logic (a condition, a case arm, an arithmetic operation) and its
      # meaning is written nowhere; that is where a magic number obscures
      # intent.
      ignored-numbers:
        - "0o600"
        - "0o644"
        - "0o700"
        - "2"
        - "3"
        - "4"
        - "5"
        - "8"
        - "10"
        - "16"
        - "20"
        - "32"
        - "64"
        - "100"
        - "128"
        - "256"
        - "512"
        - "1024"
        - "2048"
        - "4096"
        - "16384"
        - "429"
      checks:
        - case
        - condition
        - operation
        - return
      # List of function patterns to exclude from analysis.
      # Values always ignored: `time.Date`,
      # `strconv.FormatInt`, `strconv.FormatUint`, `strconv.FormatFloat`,
      # `strconv.ParseInt`, `strconv.ParseUint`, `strconv.ParseFloat`.
      # Default: []
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets

    nakedret:
      # Make an issue if func has more lines of code than this setting, and it has naked returns.
      # Default: 30
      max-func-lines: 0

    nolintlint:
      # Exclude following linters from requiring an explanation.
      # Default: []
      allow-no-explanation: [ funlen, gocognit, golines ]
      # Enable to require an explanation of nonzero length after each nolint directive.
      # Default: false
      require-explanation: true
      # Enable to require nolint directives to mention the specific linter being suppressed.
      # Default: false
      require-specific: true

    perfsprint:
      # Optimizes into strings concatenation.
      # Default: true
      strconcat: false

    reassign:
      # Patterns for global variable names that are checked for reassignment.
      # See https://github.com/curioswitch/go-reassign#usage
      # Default: ["EOF", "Err.*"]
      patterns:
        - ".*"

    rowserrcheck:
      # database/sql is always checked.
      # Default: []
      packages:
        - github.com/jmoiron/sqlx

    sloglint:
      # Enforce not using global loggers.
      # Values:
      # - "": disabled
      # - "all": report all global loggers
      # - "default": report only the default slog logger
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#no-global
      # Default: ""
      no-global: all
      # Enforce using methods that accept a context.
      # Values:
      # - "": disabled
      # - "all": report all contextless calls
      # - "scope": report only if a context exists in the scope of the outermost function
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#context-only
      # Default: ""
      context: scope

    staticcheck:
      # SAxxxx checks in https://staticcheck.dev/docs/configuration/options/#checks
      # Example (to disable some checks): [ "all", "-SA1000", "-SA1001"]
      # Default: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
      checks:
        - all
        # Incorrect or missing package comment.
        # https://staticcheck.dev/docs/checks/#ST1000
        - -ST1000
        # Use consistent method receiver names.
        # https://staticcheck.dev/docs/checks/#ST1016
        - -ST1016
        # Omit embedded fields from selector expression.
        # https://staticcheck.dev/docs/checks/#QF1008
        - -QF1008
        # EXCLUDED CHECK, WITH REASON. QF1001 rewrites
        # `!((c >= 'a' && c <= 'z') || (c >= '0' && c <= '9'))` as
        # `(c < 'a' || c > 'z') && (c < '0' || c > '9')`. The negated form says
        # "this character is not one of the permitted characters", which is what
        # the validator means; the De Morgan form is a rewrite of a set
        # membership test into four range comparisons, and every reported site is
        # a character-class validator.
        - -QF1001
        # EXCLUDED CHECK, WITH REASON. ST1005 rejects any error string that starts
        # with a capital. Every reported message starts with the product name,
        # which is a proper noun; the checker has no way to tell that from a stray
        # capital, and rewording user-visible text to lowercase the product name
        # would be the wrong trade.
        - -ST1005

    usetesting:
      # Enable/disable `os.TempDir()` detections.
      # Default: false
      os-temp-dir: true

  exclusions:
    # Log a warning if an exclusion rule is unused.
    # Default: false
    warn-unused: true
    # Predefined exclusion rules.
    # Default: []
    presets:
      - std-error-handling
      - common-false-positives
    # Excluding configuration per-path, per-linter, per-text and per-source.
    rules:
      - source: 'TODO'
        linters: [ godot ]
      - text: 'should have a package comment'
        linters: [ revive ]
      - text: 'exported \S+ \S+ should have comment( \(or a comment on this block\))? or be unexported'
        linters: [ revive ]
      - text: 'package comment should be of the form ".+"'
        source: '// ?(nolint|TODO)'
        linters: [ revive ]
      - text: 'comment on exported \S+ \S+ should be of the form ".+"'
        source: '// ?(nolint|TODO)'
        linters: [ revive, staticcheck ]
      # Disable recvcheck for api types, as generated OpenAPI model name code uses value receivers
      - path: 'api/.*\.go$'
        linters:
          - recvcheck
      - path: '_test\.go'
        linters:
          - bodyclose
          - dupl
          - errcheck
          - forbidigo
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
      - path: '_test\.go'
        linters:
          - revive
        text: "dot-imports"
      - path: '_test\.go'
        linters:
          - revive
        text: "context-as-argument"

      # --- Lint policy: exclusions that carry the reason they exist. ---
      #
      # Each entry below replaces a per-site suppression list with one statement
      # about why the linter and this codebase disagree. Nothing here weakens
      # errcheck, gosec's file-path and injection rules, or any refusal, consent,
      # journal or security check.

      # sqlclosecheck asks every caller to `defer rows.Close()`. This tree closes
      # explicitly and checks the error instead (`if err := rows.Close(); err !=
      # nil`), because a failed close on the publication database must surface
      # rather than disappear into a deferred call that has nowhere to report it.
      # Deferring also keeps an outer cursor open while the same connection runs
      # the inner query, which is why state/store.go closes the outer rows before
      # opening the certificates cursor at all. The two "was not closed" reports
      # are queries asserted to fail (`SELECT 1` on a connection that is already
      # done), where there are no rows to close.
      - text: 'Close|was not closed'
        linters: [ sqlclosecheck ]

      # nonamedreturns reports every named result. This tree names results only
      # where the tuple is wide enough that position is not self-evident, and it
      # enables `nakedret` with max-func-lines 0, which rejects a naked return
      # outright. The two linters together are the policy: a name may document
      # ordering, and can never stand in for a return statement.
      - text: 'named return'
        linters: [ nonamedreturns ]

      # dupl is a token-clone detector, and what it finds here is the
      # straight-line SQL row-scan block: QueryContext, a Scan into fields in
      # column order, a loop, rows.Err. Those blocks are spelled out rather than
      # shared so that column order and struct field order stay visibly paired at
      # the call site; a shared scanner or a generic mapper would need reflection
      # or a row-descriptor argument and would put the pairing somewhere the
      # reader cannot check against the SELECT. Duplication in that shape is a
      # reviewable safety property, not maintenance debt.
      - text: 'lines are duplicate of'
        linters: [ dupl ]

      # unparam fires on parameters that are constant at every current call site.
      # Production validators pass `stage`, `maximum` and `expected` explicitly
      # at each call so the refusal stage and the bound are visible where the call
      # is made, and removing the parameter would move that fact into the callee
      # for the next caller to infer. `_test.go` fixtures keep the
      # production-shaped signature for the same reason.
      - text: 'always receives'
        linters: [ unparam ]
      - path: '_test\.go'
        linters: [ unparam ]

      # unqueryvet forbids `SELECT *`. The reported queries are fixture probes
      # that read a whole row back out of a table the fixture just wrote, where
      # naming the columns would defeat the purpose of the check. Production
      # queries never use `*`.
      - path: '_test\.go'
        linters: [ unqueryvet ]

      # errorlint wants errors.Is where a value is compared with ==. The three
      # reported comparisons compare a *class* sentinel returned by
      # `(*publicationstate.Error).Class()`, which by construction returns one of
      # the class sentinels unwrapped; nothing there carries a wrap, so errors.Is
      # would add a call and no behaviour.
      - path: 'internal/publicationstate/(types|incoming_material_intake)\.go'
        linters: [ errorlint ]
        text: 'comparing with ==|switch on an error'
      - path: 'internal/cli/pull\.go'
        linters: [ errorlint ]
        text: 'comparing with =='

      # errorlint wants `%w` for the cause in `fmt.Errorf("%w: %v", Sentinel,
      # err)`. The %v is deliberate: this tree wraps exactly one sentinel per
      # error so that errors.Is resolves the refusal class and not the underlying
      # cause, and promoting the cause to %w would make an inner sentinel
      # accidentally matchable and change which refusal a caller sees.
      - text: 'non-wrapping format verb'
        linters: [ errorlint ]

      # staticcheck SA1019 reports deprecated standard-library APIs. The sites
      # are deliberate low-level uses with no in-tree replacement that preserves
      # the wire format: ecdsa PublicKey.X/.Y and PrivateKey.D for DPoP JWK
      # encoding, crypto/elliptic for the same, tar.Header.Xattrs for retained v1
      # archives, and poly1305 in a test. Tracked as a migration, not as a lint
      # fix; narrowing the rule to these files means a new deprecation elsewhere
      # still reports.
      - linters: [ staticcheck ]
        text: 'SA1019:'
        path: 'internal/remote/atproto/(dpop|dpop_test|atprototest/revision)\.go|internal/vault/(envelope_test|snapshot)\.go'


      # --- musttag: production types that only a test marshals. ---
      #
      # musttag reports a struct passed to encoding/json (here: in a test) whose
      # fields carry no `json` tag, and it follows nested field types into the
      # production packages. None of the types below is encoded as JSON in
      # production: they are configuration, reconciliation and journal values
      # with no wire format at all, or structs the CLI renders field by field.
      # A tag is a compatibility promise about a wire format; tagging ~100
      # fields that nothing serializes would invent a format and then freeze it.
      # Each entry is scoped to one file and one finding text, and the finding
      # it covers is named in its reason. If one of these types does acquire a
      # JSON wire format, its entry must be deleted at the same time as the tags
      # are added.
      #
      # publicationstate.Limits and publicationstate.AttemptLimits are decoded
      # from the golden attempts-v2 fixture manifest, whose keys are their Go
      # field names because the generator marshals them as-is.
      - path: 'internal/publicationstate/incoming_material_upgrade_fixture_test\.go'
        linters: [ musttag ]
        text: 'should be annotated with the `json` tag'

      # atproto.SessionStatus is marshaled only by TestSessionStatusContainsNoSecrets,
      # which proves the status carries no secret text under the default encoding.
      # `dottie account status` prints its fields individually.
      - path: 'internal/remote/atproto/oauth_session_test\.go'
        linters: [ musttag ]
        text: 'should be annotated with the `json` tag'

      # syncengine.Plan is marshaled only by TestReconcileDiagnosticRedactsPayload,
      # to contrast the redacted diagnostic with a naive marshal of the plan. The
      # emitted diagnostic type is tagged; Plan, Decision, SideStates,
      # TargetBinding and FingerprintSet are not encoded anywhere.
      - path: 'internal/syncengine/reconcile_test\.go'
        linters: [ musttag ]
        text: 'should be annotated with the `json` tag'

      # service.PublicationProposalRecord is marshaled only to prove that no
      # candidate bytes surface in its default encoding. It is persisted through
      # the publication proposal store, never as JSON.
      - path: 'tests/integration/publication_v2_privacy_test\.go'
        linters: [ musttag ]
        text: 'should be annotated with the `json` tag'

      # publicationTwoMachineCrashRequest is a test-local handshake between this
      # test and its re-executed child process. It has no tags of its own because
      # its fields are platform.Paths and config.Config, the latter being
      # toml-shaped; the two reports in this file (marshal of the request, decode
      # in the child) are the same struct and one rule covers both.
      - path: 'tests/local/publication_two_machine_test\.go'
        linters: [ musttag ]
        text: 'should be annotated with the `json` tag'

      # --- usetesting: directories that must outlive the test. ---
      #
      # os.MkdirTemp is right at both sites because the directory is evidence
      # whose path is reported to the operator: the committed-WAL artifact root
      # is either the operator's DOTTIE_P17_B7_WAL_EVIDENCE_ROOT or a directory
      # named in the test log, and the PDS failure artifact path is printed by
      # t.Fatalf so the owner can read the artifact after the run. t.TempDir()
      # cannot take a chosen root and deletes its directory when the test ends,
      # which would destroy exactly what these calls are for.
      - path: 'internal/publicationstate/incoming_material_schema_test\.go|internal/remote/atproto/fence_live_test\.go'
        linters: [ usetesting ]
        text: 'os\.MkdirTemp\(\) could be replaced by t\.TempDir\(\)'
